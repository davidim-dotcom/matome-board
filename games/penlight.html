<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ペンライト・オンステージ · 마토메 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<!-- 펜라이트 리듬 게임(2026-10 말). 보드의 게임 탭이 iframe 으로 연다. 라이브 객석에서 무대 곡에 맞춰 펜라이트를 흔드는 게임:
     노트가 판정선에 닿을 때 그 레인을 탭(●), 길게 누르기(롱 노트), 화살표 방향으로 밀기(플릭), 「ハイ!」 같은 콜 노트.
     음악은 칩튠 시퀀서(ラン 과 같은 tone/KIT)로 그 자리에서 만들고, 채보는 곡의 리드 멜로디에서 난이도별로 뽑는다(buildChart).
     박자 기준은 AudioContext.getOutputTimestamp(지금 스피커로 나가는 소리의 시각)라 기기 출력 지연이 저절로 맞는다. 남는 차이는 '타이밍' ±로 맞춘다(pen-offset). -->
<style>
:root{--bg:#EEF1F8;--surface:#FFFFFF;--ink:#1B1F3B;--muted:#646985;--line:#D5DAE8;--pink:#D6246E;--cyan:#13819A;--amber:#B7791F;--pink-soft:#FBE3EE;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#13152A;--surface:#1E2139;--ink:#ECEDF6;--muted:#9A9EBB;--line:#30345A;--pink:#FF5C9A;--cyan:#4FC3D9;--amber:#F2B655;--pink-soft:#3A1F33;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Noto Sans JP",system-ui,sans-serif;font-size:14px;line-height:1.5;padding:4px 2px 20px}
button,input{font:inherit;color:inherit}
.wrap{max-width:440px;margin:0 auto}
.lab{font-size:12px;color:var(--muted);margin:8px 0 4px;letter-spacing:.04em}
.row{display:flex;gap:6px;flex-wrap:wrap}
.pick{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 6px;cursor:pointer;text-align:center;line-height:1.25}
.pick b{display:block;font-size:13px} .pick small{color:var(--muted);font-size:11px}
.pick[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft)} .pick[aria-pressed="true"] b{color:var(--pink)}
.stage{position:relative;margin-top:8px;border-radius:14px;overflow:hidden;background:#07081a;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 0 0;font-size:12px;color:var(--muted)}
.bar button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;cursor:pointer}
.board{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.board .hd{display:flex;justify-content:space-between;align-items:center}
.board .hd p{margin:0;font-size:12px;color:var(--muted);letter-spacing:.04em}
.board .hd button{border:0;background:none;color:var(--cyan);cursor:pointer}
ol.rank{list-style:none;margin:6px 0 0;padding:0}
ol.rank li{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 2px;border-top:1px solid var(--line);font-size:13px}
ol.rank li .no{font-weight:700;color:var(--muted);text-align:center} ol.rank li.top1 .no{color:#e0a400} ol.rank li.top2 .no{color:#9aa4b8} ol.rank li.top3 .no{color:#c27a3a}
ol.rank li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} ol.rank li .st{font-size:11px;color:var(--muted)} ol.rank li.mine{background:var(--pink-soft)}
ol.rank li.nil{display:block;color:var(--muted);text-align:center;padding:14px 0}
form.sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 0;padding:8px;border-radius:10px;background:var(--pink-soft)}
form.sub .me{flex-basis:100%;font-size:13px} form.sub input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
form.sub button{border:0;background:var(--pink);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.help{font-size:12px;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.pbtn{position:absolute;left:8px;top:8px;width:42px;height:42px;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(10,8,30,.6);color:#fff;font-size:15px;cursor:pointer;touch-action:manipulation}
.pmenu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,5,15,.66)}
.pbtn[hidden],.pmenu[hidden]{display:none}
.pmenu .box{width:min(240px,80%);background:#171436;border:1px solid #5b4aa8;border-radius:14px;padding:16px;display:grid;gap:8px;text-align:center;color:#ffe3f3}
.pmenu .box b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:24px;letter-spacing:.04em}
.pmenu .box small{color:#b8a8ff;font-size:12px}
.pmenu button{border:0;border-radius:10px;padding:11px;font-weight:700;cursor:pointer;background:#2a2357;color:#fff;touch-action:manipulation}
.pmenu button.go{background:#D6246E}
</style>
</head>
<body>
<div class="wrap">
  <p class="lab">SONG · 곡</p>
  <div class="row" id="songs"></div>
  <p class="lab">LEVEL · 난이도</p>
  <div class="row" id="levels"></div>
  <div class="stage" id="stage"><canvas id="cv" width="360" height="560"></canvas>
    <button type="button" class="pbtn" id="pbtn" aria-label="일시정지" hidden>❚❚</button>
    <div class="pmenu" id="pmenu" hidden><div class="box"><b>PAUSE</b><small id="pinfo"></small>
      <button type="button" class="go" id="pGo">▶ 이어서 하기</button><button type="button" id="pRe">↻ 처음부터</button><button type="button" id="pQuit">■ 그만하기 · 곡 고르기</button></div></div></div>
  <div class="bar"><span>타이밍 <button type="button" id="offM">−</button> <b id="offV">0ms</b> <button type="button" id="offP">+</button></span><button type="button" id="snd">♪ 소리 켜짐</button></div>
  <p class="help">노트가 아래 선에 닿을 때 그 줄을 탭 · 길쭉한 노트는 끝까지 누르기 · 화살표 노트는 그 방향으로 밀기 · 「ハイ!」는 콜. 도중에 멈추려면 왼쪽 위 ❚❚(PC는 Esc) — 이어서 하기·처음부터·그만하기. 소리와 노트가 어긋나면 타이밍 ±(늦게 들리면 +). PC는 D·F·J 키와 ←·→.</p>
  <div class="board">
    <div class="hd"><p id="rkTitle">SCORE BOARD</p><button type="button" id="rkRe">↻ 새로고침</button></div>
    <form class="sub" id="sub" hidden><span class="me" id="subMe"></span><input id="name" maxlength="12" placeholder="이름 (12자까지)" autocomplete="nickname"><button id="subBtn">기록 등록</button></form>
    <ol class="rank" id="rank"></ol>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), cv=$('cv'), cx=cv.getContext('2d'), W=360, H=560;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// 고해상도 화면에서 흐리지 않게
function fit(){const r=Math.min(3,window.devicePixelRatio||1);cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0)}fit();

// ---------- 그림(저장소 도트) ----------
const IMG={};for(const [k,f] of [['lilly','../assets/game/player.png'],['lillyB','../assets/game/skill_b.png'],['sora','../assets/game/hc_sora_m.png'],['miko','../assets/game/hc_miko_m.png'],['cat','../assets/game/cat.png']]){const i=new Image();i.src=f;IMG[k]=i}
cx.imageSmoothingEnabled=false;

// ---------- 소리(칩튠: ラン 과 같은 방식) ----------
let AC=null, BUS=null, DLY=null, NB=null, snd=true;try{snd=localStorage.getItem('pen-snd')!=='off'}catch(e){}
// 출력 버스. 멈추거나 그만둘 때 새로 만들어, 옛 버스에 이미 예약된 음(0.2초 앞까지)·콜 녹음을 끊는다
function mkBus(){if(BUS){try{BUS.disconnect();DLY.disconnect()}catch(e){}}
  BUS=AC.createGain();BUS.gain.value=snd?.1:0;const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;BUS.connect(comp);comp.connect(AC.destination);
  DLY=AC.createDelay(1);DLY.delayTime.value=.18;const fb=AC.createGain();fb.gain.value=.22;const wet=AC.createGain();wet.gain.value=.28;DLY.connect(fb);fb.connect(DLY);DLY.connect(wet);wet.connect(BUS)}
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();mkBus();
  NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const o=NB.getChannelData(0);for(let i=0;i<o.length;i++)o[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume();return AC}
const midi=n=>440*Math.pow(2,(n-69)/12);
const PW={};function pulse(duty){if(duty>=.5)return null;if(PW[duty])return PW[duty];const N=32,re=new Float32Array(N),im=new Float32Array(N);for(let k=1;k<N;k++){re[k]=Math.sin(2*Math.PI*k*duty)/(Math.PI*k)*2;im[k]=(1-Math.cos(2*Math.PI*k*duty))/(Math.PI*k)*2}return PW[duty]=AC.createPeriodicWave(re,im)}
function tone(n,t,d,o){const os=AC.createOscillator(),v=AC.createGain();if(o.tri)os.type='triangle';else{const pw=pulse(o.duty||.5);if(pw)os.setPeriodicWave(pw);else os.type='square'}os.frequency.setValueAtTime(midi(n),t);
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(o.g,t+.006);v.gain.setValueAtTime(o.g,t+d*(o.rel||.55));v.gain.exponentialRampToValueAtTime(.0005,t+d);os.connect(v);v.connect(BUS);if(o.echo)v.connect(DLY);os.start(t);os.stop(t+d+.05)}
function nz(t,d,f,g,type){const s=AC.createBufferSource();s.buffer=NB;const bp=AC.createBiquadFilter();bp.type=type||'highpass';bp.frequency.value=f;const v=AC.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(bp);bp.connect(v);v.connect(BUS);s.start(t);s.stop(t+d)}
function kick(t,f0,f1,d,g){const o=AC.createOscillator(),v=AC.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d*.7);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(BUS);o.start(t);o.stop(t+d+.02)}
const KIT={k:t=>kick(t,160,45,.16,.9),s:t=>{nz(t,.14,1800,.5,'bandpass');kick(t,220,160,.06,.25)},h:t=>nz(t,.04,7000,.15),c:t=>nz(t,.5,4000,.22)};
function hitSfx(kind){if(!snd||!AC)return;const t=AC.currentTime;if(kind==='call'){tone(84,t,.08,{duty:.125,g:.05})}else if(kind==='flick'){tone(88,t,.06,{duty:.25,g:.04});tone(95,t+.03,.06,{duty:.25,g:.03})}}

// ---------- 곡 ----------
// 1) まとめ☆ステージ(이 게임을 위해 지은 칩튠 아이돌 팝, C장조 150BPM). 마디 = [코드 근음, 장조?, 리드 '음:길이(16분)' 나열, 콜]. 콜은 [칸, 글자]
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const nn=s=>{if(s==='-')return 0;const m=s.match(/^([A-G])(#?)(\d)$/);return 12*(+m[3]+1)+NOTE[m[1]]+(m[2]?1:0)};
const V=[[48,1,'E5:2 E5:2 G5:2 E5:2 D5:4 C5:4'],[43,1,'D5:2 D5:2 G5:2 D5:2 B4:8'],[45,0,'C5:2 C5:2 E5:2 A5:2 G5:4 E5:4'],[41,1,'F5:4 E5:4 D5:4 -:4',[[12,'せーの!']]],
  [48,1,'E5:2 E5:2 G5:2 C6:2 B5:4 G5:4'],[43,1,'A5:2 G5:2 F5:2 E5:2 D5:8'],[45,0,'C5:2 E5:2 A5:2 B5:2 C6:4 A5:4'],[43,1,'G5:8 -:4 G5:2 A5:2']];
const C=[[41,1,'C6:4 C6:2 A5:2 C6:4 D6:4'],[43,1,'B5:4 G5:4 D6:8'],[40,0,'B5:2 B5:2 G5:2 E5:2 G5:4 B5:4'],[45,0,'A5:8 -:4 E5:2 G5:2',[[8,'ハイ!']]],
  [41,1,'A5:4 A5:2 C6:2 F6:4 E6:4'],[43,1,'D6:4 C6:2 B5:2 C6:2 D6:2 G5:4'],[48,1,'E6:4 D6:4 C6:4 G5:4'],[48,1,'C6:12 -:4',[[12,'ハイ!']]]];
const INTRO=[[48,1,'-:16'],[43,1,'-:16'],[45,0,'-:16'],[41,1,'-:12 G5:2 A5:2']];
function bars(list,sec){return list.map(([r,maj,mel,calls])=>({r,maj,mel,calls:calls||[],sec}))}
const STAGE_SONG={bpm:150,bars:[...bars(INTRO,'i'),...bars(V,'v'),...bars(C,'c'),...bars(V,'v'),...bars(C,'c'),...bars(C,'c'),...bars([[48,1,'C6:16']],'o')]};

// 곡 → {steps:[{t,ev:[…]}], len, dur, lead:[{i,n,l}], calls:[{i,text}], snare:[i], beat}
// ev: ['m',음,길이칸] 리드 · ['b',음,길이] 베이스 · ['a',음,길이] 아르페지오 · ['d','k'|'s'|'h'|'c']
function buildStage(){const S=STAGE_SONG,st=60/S.bpm/4,steps=[],lead=[],calls=[],snare=[];let i=0;
  for(const b of S.bars){const base=i;let at=0;
    for(const tok of b.mel.split(/\s+/)){const [ns,ls]=tok.split(':'),n=nn(ns),l=+ls;if(n){lead.push({i:base+at,n,l});(steps[base+at]=steps[base+at]||[]).push(['m',n,l])}at+=l}
    for(const [k,txt] of b.calls)calls.push({i:base+k,text:txt});
    for(let s=0;s<16;s++){const ev=steps[base+s]=steps[base+s]||[];
      if(s%4===0)ev.push(['b',b.r+(s===4||s===12?12:0),3]);
      if(b.sec!=='i'||s%2===0){const arp=[0,b.maj?4:3,7,12,7,b.maj?4:3,12,19][(s/2|0)%8];if(s%2===0)ev.push(['a',b.r+24+arp,2])}
      if(b.sec!=='i'){if(s===0||s===8||(b.sec==='c'&&s===10))ev.push(['d','k']);if(s===4||s===12){ev.push(['d','s']);snare.push(base+s)}if(s%2===0)ev.push(['d','h'])}
      else if(s===0)ev.push(['d','k'])}
    if(b.sec==='c'&&i%(16*8)===0)(steps[base]=steps[base]||[]).push(['d','c']);
    i+=16}
  return {steps,len:i,st:()=>st,lead,calls,snare,bpm:S.bpm}}
function unMidi(M){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/',ev=[];for(const k in M.tr){const s=M.tr[k];let at=0;for(let i=0;i+2<s.length;i+=3){at+=A.indexOf(s[i]);const l=A.indexOf(s[i+1]);if(!l)continue;(ev[at]=ev[at]||[]).push([k,A.indexOf(s[i+2])+M.pb,l])}}return ev}
function buildUma(){const M=RUN_MIDI;if(!M.tr)return buildStage();const src=unMidi(M),from=M.loop,seg=M.len-from,steps=[],lead=[],calls=[],snare=[],bpm=170;
  for(let rep=0;rep<2;rep++)for(let j=0;j<seg;j++){const i=rep*seg+j,e=src[from+j];if(!e)continue;
    for(const [k,n,l] of e){if(k==='d'){const d=n===36?'k':n===38?'s':n===49?'c':'h';(steps[i]=steps[i]||[]).push(['d',d]);if(d==='s')snare.push(i)}
      else{(steps[i]=steps[i]||[]).push([k,n,l]);if(k==='m')lead.push({i,n,l})}}}
  for(const c of [64,96,384])for(let rep=0;rep<2;rep++)calls.push({i:rep*seg+c-from,text:'うまぴょい!',voice:true});
  return {steps,len:seg*2,st:()=>60/bpm/4,lead,calls,snare,bpm}}

// 채보: 리드 멜로디의 음 시작을 노트로(노트 사이 최소 간격 minGap: EASY 1.5박·NORMAL .75박). 레인은 음이 오르면 오른쪽·내리면 왼쪽으로(같은 줄에 너무 빠르게 붙으면 옆 줄로)
function buildChart(song,lv){const st=song.st(),notes=[],holdMin=lv===1?8:6,minGap=[0,1.5,.75,0][lv]*60/song.bpm;let lane=1,prevN=null,prevT=-9,prevLane=-1,lastT=-9;
  const callAt=new Set(song.calls.map(c=>c.i));
  const L=song.lead.filter(x=>!callAt.has(x.i)&&(lv>1||x.i%2===0)&&(lv>2||x.i%2===0||x.l>=2));
  for(let k=0;k<L.length;k++){const x=L[k],nx=L[k+1],t=x.i*st;if(t-lastT<minGap)continue;lastT=t;
    if(prevN!=null){if(x.n>prevN)lane=Math.min(2,lane+1);else if(x.n<prevN)lane=Math.max(0,lane-1);else if(lv>1&&k%3===2)lane=lane===1?(k%2?0:2):1}
    if(lane===prevLane&&t-prevT<.17)lane=lane===1?(x.n>=(prevN||0)?2:0):1;
    let type='tap',dur=0;const restAfter=nx?nx.i-(x.i+x.l):99,phraseEnd=!nx||Math.floor(nx.i/64)!==Math.floor(x.i/64)||restAfter>=4;
    if(x.l>=holdMin&&(!nx||nx.i-x.i>=x.l)){type='hold';dur=Math.max(.25,(x.l-1)*st)}
    else if(lv>1&&(phraseEnd||(lv===3&&restAfter>=2&&k%3===0))){type='flick'} // 프레이즈 끝(쉼표 앞·4마디 끝)은 밀기
    notes.push({t,lane,type,dur,dir:type==='flick'?(lane===0?-1:lane===2?1:(nx&&nx.n<x.n?-1:1)):0});prevN=x.n;prevT=t+dur;prevLane=lane}
  if(lv===3){const busy=i=>notes.some(n=>Math.abs(n.t-i*st)<st*1.5);for(const i of song.snare)if(!busy(i)&&i%8===4)notes.push({t:i*st,lane:i%16===4?0:2,type:'tap',dur:0,dir:0})}
  for(const c of song.calls)notes.push({t:c.i*st,lane:1,type:'call',dur:0,dir:0,text:c.text,voice:c.voice});
  notes.sort((a,b)=>a.t-b.t||(b.type==='call')-(a.type==='call'));
  // 같은 줄에서 앞 노트(롱 노트 끝 포함)와 겹치면 뺀다(콜은 남기고 그 자리 노트를 뺀다)
  const lastEnd=[-9,-9,-9],out=[];for(const n of notes){if(n.t<lastEnd[n.lane]+.1)continue;out.push(n);lastEnd[n.lane]=n.t+n.dur}
  return out}

// 지금 스피커로 나가는 소리의 곡 안 시각(초). getOutputTimestamp 가 있으면 출력 지연까지 반영

  G.t0=c.currentTime+2.2;G.next=G.t0;G.dur=song.len*song.st()+1.5;G.resumeTo=null;presses.clear();clearInterval(G.timer);G.timer=setInterval(tick,30);$('sub').hidden=true;ui()}

// 일시정지: 박자 시계를 그 자리에 세우고 예약된 소리를 버린다. 누르고 있던 롱 노트는 그대로 끝난 것으로(감점 없음)

let callBuf=null,callLd=false;function callLoad(){if(callLd||!AC)return;callLd=true;fetch('../assets/race/umapyoi.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>new Promise((res,rej)=>AC.decodeAudioData(b,res,rej))).then(b=>{callBuf=b}).catch(()=>{})}
const frameHidden=()=>{try{return !!window.frameElement&&!frameElement.getClientRects().length}catch(e){return false}};
function tick(){if(G.state!=='play'||!AC)return;if(frameHidden())return pause('게임 화면을 떠나서 일시정지했어요');const song=G.song,st=song.st();if(document.hidden)return;

const PTS={p:1000,g:700,o:300};
function judge(n,dt,kind){const a=Math.abs(dt),r=a<=WIN.p?'p':a<=WIN.g?'g':'o';n.hit=r;G.j[r]++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);

function drawTitle(now){cx.fillStyle='rgba(5,5,15,.62)';cx.fillRect(0,206,W,H-206);cx.textAlign='center';cx.fillStyle='#ffe3f3';cx.font='bold 28px "Black Han Sans",sans-serif';cx.fillText('ペンライト',W/2,290);cx.fillText('オンステージ',W/2,326);

let last=performance.now();
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000);last=ts;

  if(G.state==='play'){for(const n of G.notes){if(n.hit||n.done)continue;if(n.t-now>0)break;if(now-n.t>WIN.o+.02&&n.type!=='flick')miss(n);else if(n.type==='flick'&&now-n.t>WIN.o+.12){let pend=false;for(const p of presses.values())if(p.note===n)pend=true;if(!pend)miss(n)}}
    for(const n of G.notes)if(n.type==='hold'&&n.held&&now>=n.t+n.dur){n.held=false;n.done=true;G.score+=Math.round(300*(G.feverT>0?1.5:1));G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);burst(n.lane,'p');for(const [id,p] of presses)if(p.note===n)presses.delete(id)}

  let lastSent=0;try{lastSent=+localStorage.getItem('pen-sent')||0}catch(err){}if(Date.now()-lastSent<30000){toast('조금 뒤에 다시 등록해 주세요');return}
  const body=JSON.stringify({type:'score',game:'pen',name,score:run.score,stage:run.stage,skin:run.skin,clear:run.clear});$('subBtn').disabled=true;
  try{let ok=false;try{const r=await fetch(a,{method:'POST',body});ok=r.ok&&(await r.json()).ok===true}catch(err){await fetch(a,{method:'POST',body,mode:'no-cors'});ok=true}if(!ok)throw 0;
    RK.sent=true;RK.mine={name,score:run.score};try{localStorage.setItem('dm-name',name);localStorage.setItem('pen-sent',String(Date.now()))}catch(err){}$('sub').hidden=true;toast('기록을 등록했어요');setTimeout(loadRank,1200)}
  catch(err){$('subBtn').disabled=false;toast('등록하지 못했어요. 잠시 뒤 다시 시도해 주세요')}});
$('rkRe').onclick=loadRank;loadRank();
$('pbtn').onclick=()=>pause();$('pGo').onclick=resume;$('pRe').onclick=()=>{quit();start()};$('pQuit').onclick=()=>quit('곡을 그만뒀어요');
window.PEN={G,SONGS,LEVELS,buildChart,start,songNow,pause,resume,quit}; // 점검용
})();
</script>
