name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 홀로라이브 피드 점검 2 (임시)
        if: always()
        run: |
          python - <<'PY'
          import re, sys, html
          sys.path.insert(0, ".")
          import collector as C
          for u in ["https://hololivepro.com/news/", "https://hololive.hololivepro.com/news/"]:
              t = C.fetch(u).decode("utf-8", "replace")
              alts = re.findall(r'<link[^>]+type="application/(?:rss|atom)\+xml"[^>]*href="([^"]+)"', t) + re.findall(r'href="([^"]+)"[^>]*type="application/(?:rss|atom)\+xml"', t)
              print("\n==", u, "alt", alts)
              for a in alts:
                  try:
                      b = C.fetch(html.unescape(a)); print("   feed OK", a, len(b), b[:150])
                  except Exception as e: print("   feed ERR", a, e)
              # 뉴스 목록 구조
              i = t.find("news"); 
              arts = re.findall(r"<(article|li)[^>]*>.*?</\1>", t, re.S)
              print("   article/li 수", len(arts))
              links = re.findall(r'<a [^>]*href="(https?://[^"]*news/[^"]+)"[^>]*>(.*?)</a>', t, re.S)
              print("   news 링크", len(links))
              for h, x in links[:8]: print("     ", h[:80], "|", re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", x))).strip()[:80])
              j = t.find(links[0][0]) if links else -1
              print("   HTML 근처:", re.sub(r"\s+", " ", t[max(0, j-1200):j+800]))
          PY
