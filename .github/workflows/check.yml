name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 디시 점검 (임시)
        if: always()
        run: |
          python - <<'PY'
          import re, gzip, html, urllib.request, urllib.error
          H = {"User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36",
               "Accept": "text/html,*/*", "Accept-Language": "ko", "Accept-Encoding": "gzip", "Referer": "https://m.dcinside.com/"}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=20) as r:
                  b = r.read(); b = gzip.decompress(b) if r.headers.get("content-encoding") == "gzip" else b
                  return b.decode("utf-8", "replace")
          t = get("https://m.dcinside.com/robots.txt"); i = t.find("그 외 모든 봇"); print("[robots m]", t[i-10:i+1200])
          t = get("https://m.dcinside.com/board/comic_new6/6723707")
          for kw in ["[시리즈]", "series", "시리즈"]:
              for m in list(re.finditer(re.escape(kw), t))[:4]:
                  print(f"\n[{kw} @ {m.start()}]", re.sub(r"\s+", " ", t[max(0, m.start()-300): m.start()+1500]))
          print("\n[classes containing seri]", sorted(set(re.findall(r'class="([^"]*seri[^"]*)"', t))))
          print("[adult markers]", sorted(set(re.findall(r'(adult[^"\s]{0,30}|성인[^<"]{0,20})', t)))[:15])
          t = get("https://m.dcinside.com/board/comic_new6/6741849")
          print("\n[POST 6741849] adult markers", sorted(set(re.findall(r'(adult[^"\s]{0,30}|성인[^<"]{0,20}|19금)', t)))[:15], "len", len(t))
          PY
