name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 닌슬 링크 점검 (임시)
        if: always()
        run: |
          python - <<'PY'
          import re, sys, html, urllib.error
          sys.path.insert(0, ".")
          import collector as C
          clean = lambda x: re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", x))).strip()
          for u in ["https://m.dcinside.com/mini/yukiyogo/323", "https://m.dcinside.com/mini/yukiyogo/321", "https://m.dcinside.com/mini/yukiyogo/364", "https://m.dcinside.com/mini/yukiyogo/6",
                    "https://m.dcinside.com/mini/yukiyogo/80", "https://m.dcinside.com/board/comic_new2/7152768", "https://m.dcinside.com/board/comic_new3/13201690", "https://m.dcinside.com/board/comic_new4/1773757", "https://m.dcinside.com/mini/yukiyogo/999999"]:
              try:
                  t = C.dc_fetch(u)
              except urllib.error.HTTPError as e:
                  print("\n##", u, "HTTP", e.code); continue
              except Exception as e:
                  print("\n##", u, "ERR", e); continue
              h = re.search(r'"headline":"([^"]*)"', t); title = re.search(r"<title>(.*?)</title>", t, re.S)
              i = t.find('class="thum-txtin"'); j = t.find('class="gall-detail-lst', i); body = t[i:j] if i >= 0 else ""
              imgs = body.count("viewimage.php")
              links = [(html.unescape(a), clean(x)[:50]) for a, x in re.findall(r'<a [^>]*href="([^"]+)"[^>]*>(.*?)</a>', body, re.S)]
              print("\n##", u, "len", len(t), "headline", h.group(1)[:50] if h else None, "| title", clean(title.group(1))[:60] if title else None, "| body", len(body), "imgs", imgs)
              for a, x in links[:12]: print("    ", a[:100], "|", x)
              if not h: print("   본문 앞:", clean(t[:3000])[:400])
          PY
