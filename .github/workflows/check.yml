name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 표지 점검 (임시)
        if: always()
        run: |
          pip install -q pillow
          python - <<'PY'
          import json, hashlib, io, base64, sys
          sys.path.insert(0, ".")
          import collector as C
          from PIL import Image
          d = json.load(open("data/comics.json", encoding="utf-8"))
          seen = {}
          for s in d["series"]:
              u = s.get("cover", "")
              if not u: print("NOCOVER", s["title"]); continue
              try: raw = C.fetch(u, C.DC_UA)
              except Exception as e: print("FAIL", s["title"], e); continue
              h = hashlib.md5(raw).hexdigest()[:10]
              im = Image.open(io.BytesIO(raw)).convert("RGB"); w, hh = im.size
              im.thumbnail((90, 120)); b = io.BytesIO(); im.save(b, "JPEG", quality=60)
              seen.setdefault(h, []).append(s["title"])
              print(f"IMG|{h}|{w}x{hh}|{len(raw)}|{s['title'][:20]}|{u[-40:]}|" + base64.b64encode(b.getvalue()).decode())
          print("DUP", {k: v for k, v in seen.items() if len(v) > 1})
          PY

