name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 닌자슬레이어 점검 (임시)
        if: always()
        run: |
          python - <<'PY'
          import re, sys, html, json
          sys.path.insert(0, ".")
          import collector as C
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36", "Accept-Language": "ko"}
          def show(name, t, n=1500):
              print(f"\n=== {name} len={len(t)}")
              print(re.sub(r"\s+", " ", t[:n]))
          try:
              t = C.fetch("https://arca.live/b/manhwa/37486873", UA).decode("utf-8", "replace")
              h = re.search(r"<title>(.*?)</title>", t, re.S); print("ARCA title", h.group(1).strip() if h else None, len(t))
              i = t.find('class="article-content'); j = t.find("article-comment", i)
              body = t[i:j] if i >= 0 else t
              links = re.findall(r'<a [^>]*href="([^"]+)"[^>]*>(.*?)</a>', body, re.S)
              print("ARCA body links", len(links))
              for hh, x in links[:12] + links[-6:]: print("   ", html.unescape(hh)[:90], "|", re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", "", x))).strip()[:60])
              txt = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", "\n", body)))
              print("ARCA body text", txt[:2500])
          except Exception as e:
              print("ARCA ERR", e)
          for u in ["https://m.dcinside.com/board/yukiyogo", "https://m.dcinside.com/board/yukiyogo?page=2", "https://gall.dcinside.com/mini/board/lists?id=yukiyogo"]:
              try:
                  t = C.dc_fetch(u)
                  h = re.search(r"<title>(.*?)</title>", t, re.S); print("\nDC", u, "title", h.group(1).strip() if h else None, len(t))
                  rows = C.dc_rows(t) if "m.dcinside" in u else []
                  print("  rows(dc_rows, comic_new6 기준)", len(rows))
                  links = re.findall(r'href="(https?://(?:m|gall)\.dcinside\.com/[^"]*yukiyogo[^"]*)"[^>]*>(.*?)</a>', t, re.S)
                  print("  yukiyogo 링크", len(links))
                  for hh, x in links[:25]: print("   ", html.unescape(hh)[:80], "|", re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", x))).strip()[:70])
                  nxt = re.findall(r'href="([^"]*page=\d+[^"]*)"', t)[:5]; print("  page links", [html.unescape(x)[-40:] for x in nxt])
              except Exception as e:
                  print("DC ERR", u, e)
          PY
