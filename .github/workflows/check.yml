name: 소스 점검

on:
  workflow_dispatch: {}
  push:
    branches: [claude/japan-events-board-setup-co2nzo]
    paths: [.github/workflows/check.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검 (--check)
        continue-on-error: true
        run: python collector.py --check
      - name: コラボカフェ events 확인
        run: |
          python - <<'PY'
          import urllib.request, json
          u = "https://collabo-cafe.com/wp-json/wp/v2/events?per_page=40&lang=ja&_fields=title,excerpt,link"
          req = urllib.request.Request(u, headers={"User-Agent": "matome-board-collector/0.1 (personal use)"})
          data = json.loads(urllib.request.urlopen(req, timeout=30).read())
          print(len(data), "건; lang=ja 로 걸러진 비율:", sum(1 for p in data if p["link"].startswith("https://collabo-cafe.com/events/")), "/", len(data))
          for p in data[:6]:
              print(" ", p["title"]["rendered"][:60], "|", (p.get("excerpt") or {}).get("rendered", "")[:80].replace("\n", " "), "|", p["link"])
          PY
