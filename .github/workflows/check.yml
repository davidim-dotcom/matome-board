name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 닌자슬레이어 점검 2 (임시)
        if: always()
        run: |
          python - <<'PY'
          import re, sys, html, time
          sys.path.insert(0, ".")
          import collector as C
          clean = lambda x: re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", x))).strip()
          t = C.dc_fetch("https://m.dcinside.com/mini/yukiyogo/95")
          h = re.search(r'"headline":"([^"]*)"', t); print("95 제목", h.group(1) if h else None, "len", len(t), "dc_series", t.find('class="dc_series"'))
          i = t.find('class="thum-txtin"'); body = t[i:t.find("gall-detail-lst", i)] if i >= 0 else t
          links = re.findall(r'<a [^>]*href="([^"]+)"[^>]*>(.*?)</a>', body, re.S)
          print("본문 링크", len(links))
          for hh, x in links: print("   ", html.unescape(hh)[:85], "|", clean(x)[:70])
          print("본문 텍스트", clean(body)[:3000])
          print("robots mini", [l for l in C.dc_fetch("https://m.dcinside.com/robots.txt").splitlines() if "mini" in l.lower() or "board" in l.lower()][:10])
          allrows = []
          for pg in range(1, 30):
              u = f"https://m.dcinside.com/mini/yukiyogo?page={pg}"
              tt = C.dc_fetch(u); time.sleep(0.7)
              rows = []
              for li in tt.split('<div class="gall-detail-lnktb">')[1:]:
                  li = li[:6000]
                  m = re.search(r"/mini/yukiyogo/(\d+)", li); j = li.find('<span class="subjectin"')
                  if not m or j < 0: continue
                  nick = re.search(r'<li class="list-nick">(.*?)<', li, re.S); d = re.search(r"<li>(\d\d\.\d\d(?:\.\d\d)?|\d\d:\d\d)</li>", li)
                  rows.append((int(m.group(1)), C.span_text(li, j), clean(nick.group(1)) if nick else "", d.group(1) if d else ""))
              if not rows or (allrows and rows[0][0] == allrows[-1][0]): break
              allrows += rows
          print("전체 글", len(allrows))
          for r in allrows: print("   ", r)
          PY
