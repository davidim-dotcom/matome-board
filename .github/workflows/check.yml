name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 홀로라이브 피드 점검 (임시)
        if: always()
        run: |
          python - <<'PY'
          import re, sys, html, json
          sys.path.insert(0, ".")
          import collector as C
          for u in ["https://hololivepro.com/news/feed/", "https://hololivepro.com/feed/", "https://hololivepro.com/news/?feed=rss2", "https://hololivepro.com/?feed=rss2",
                    "https://hololivepro.com/?post_type=news&feed=rss2", "https://hololivepro.com/category/news/feed/", "https://hololivepro.com/news/",
                    "https://hololivepro.com/wp-json/wp/v2/news?per_page=3&_fields=title,link,date_gmt", "https://hololivepro.com/wp-json/wp/v2/posts?per_page=3&_fields=title,link,date_gmt",
                    "https://hololivepro.com/wp-json/wp/v2/types", "https://hololivepro.com/en/news/feed/", "https://hololive.hololivepro.com/news/feed/", "https://hololive.hololivepro.com/news/"]:
              try:
                  b = C.fetch(u); t = b.decode("utf-8", "replace")
                  alt = re.findall(r'<link[^>]+type="application/(?:rss|atom)\+xml"[^>]*>', t)
                  items = re.findall(r"<title>(.*?)</title>", t)[:4]
                  print("OK ", u, len(b), "alt:", [html.unescape(a)[:120] for a in alt][:4], "titles:", [html.unescape(x)[:50] for x in items], t[:120].replace("\n", " ") if "json" in u else "")
              except Exception as e:
                  print("ERR", u, e)
          PY
