name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 연재 만화 시험 (임시)
        if: always()
        run: |
          python collector.py --comics
          python - <<'PY'
          import json; d=json.load(open("data/comics.json",encoding="utf-8")); S=d["series"]
          print(len(S), "편; 회차 합계", sum(len(s["episodes"]) for s in S), "; 확인한 글", len(d["scanned"]))
          for s in sorted(S, key=lambda s: -len(s["episodes"]))[:15]:
              print(f'  {len(s["episodes"]):3d}화 | {s["name"][:26]} | {s["author"]} | rec {s["rec"]} | {s["updatedAt"]} | 최신 {s["episodes"][-1]["title"][:30]} | cover {"Y" if s["cover"] else "-"}')
          PY
