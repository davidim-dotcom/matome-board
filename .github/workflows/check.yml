name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 닌자슬레이어 색인 시험 (임시)
        if: always()
        run: |
          python - <<'PY'
          import sys, json
          sys.path.insert(0, ".")
          import collector as C
          f = [x for x in C.comic_follows() if x["index"]][0]
          s = C.build_index_series(f, {"id": "x", "episodes": [], "rec": 0, "cover": ""}, set())
          print("회차", len(s["episodes"]))
          for p in s["parts"]:
              print("◆", p["name"], sum(len(a["eps"]) for a in p["arcs"]))
              for a in p["arcs"]:
                  print("   ", f"[{a['vol']}권]" if a["vol"] else "     ", a["name"], " ".join(e["label"] for e in a["eps"]), "" if all(e.get("g") for e in a["eps"]) else "(외부 링크 포함)")
          PY
