name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 야스미 빠진 화 점검 (임시)
        if: always()
        run: |
          python - <<'PY'
          import re, sys, time
          sys.path.insert(0, ".")
          import collector as C
          eps = C.expand_links([("comic_new4", 1154038, "링크 모음"), ("comic_new6", 7470, "링크 모음")])
          W = set(range(60, 65)) | set(range(115, 120)) | set(range(182, 187)) | set(range(222, 227))
          for i, e in enumerate(eps):
              n = C.ep_num(e[2])
              if n is None or n in W: print("  ", i, n, e)
          for g, no in [("comic_new4", 1154038), ("comic_new6", 7470)]:
              t = C.dc_fetch(f"https://m.dcinside.com/board/{g}/{no}"); time.sleep(1)
              odd = [x for x in C.dc_links(t) if "야스" in x[2] and C.series_key(C.strip_ep(x[2]), "") != "호리데이야스미트위터모음|"]
              print(g, no, "다른 표기", odd)
              for m in re.finditer(r"(?:62|117|184|224)", re.sub(r"<[^>]+>", " ", t)):
                  pass
          rows = C.dc_search("호리데이", 25, [25])
          print("검색 '호리데이'", [(r["no"], r["title"]) for r in rows])
          rows = C.dc_search("야스미", 25, [25])
          print("검색 '야스미'", [(r["no"], r["title"]) for r in rows])
          PY
