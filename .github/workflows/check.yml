name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 검색·시리즈 상자 점검 (임시)
        if: always()
        run: |
          python - <<'PY'
          import re, sys, urllib.parse, html
          sys.path.insert(0, ".")
          import collector as C
          t = C.dc_fetch("https://m.dcinside.com/board/comic_new6/6708224")
          i = t.find('class="dc_series"'); print("[BOX]", re.sub(r"\s+", " ", t[i:i+2500]))
          q = urllib.parse.quote("호리데이 야스미")
          for u in [f"https://m.dcinside.com/board/comic_new6?s_type=subject_m&serval={q}", f"https://gall.dcinside.com/board/lists/?id=comic_new6&s_type=search_subject&s_keyword={q}"]:
              t = C.dc_fetch(u)
              print("\n[SEARCH]", u)
              for kw in ["subjectin", "gall_tit", "search_pos", "다음검색", "검색 결과", "page="]:
                  m = t.find(kw); print("  ", kw, m, re.sub(r"\s+", " ", t[max(0,m-200):m+500]) if m >= 0 else "")
          PY
