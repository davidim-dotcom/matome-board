name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 연재 만화 시험 (임시)
        if: always()
        run: |
          pip install -q pillow
          python - <<'PY'
          import json, re, sys
          sys.path.insert(0, ".")
          import collector as C
          from datetime import datetime, timezone
          rows = C.dc_search("호리데이 야스미 트위터 모음", 2, [2])
          print("검색", len(rows), [(r["no"], r["title"]) for r in rows[:5]])
          C.export_comics(datetime.now(timezone.utc))
          d = json.load(open("data/comics.json", encoding="utf-8"))
          print("bad", d.get("bad"))
          for s in d["series"]:
              e = s["episodes"]; gs = sorted({x.get("g", "-") for x in e})
              print(f"{s['title'][:30]:32} {len(e):4}화 {gs} cover={s.get('coverNo')}")
              if "호리데이" in s["title"] or "히토너" in s["title"]:
                  nums = [C.ep_num(x["title"]) for x in e]
                  have = {n for n in nums if n}
                  print("   처음", e[:3]); print("   끝", e[-3:])
                  print("   빠진 번호", [n for n in range(2, max(have or {0}) + 1) if n not in have][:60])
                  print("   번호 역순", [(a, b) for a, b in zip(nums, nums[1:]) if a and b and b < a][:20])
          PY
