name: 소스 점검

on:
  workflow_dispatch: {}
  push:
    branches: [claude/japan-events-board-setup-co2nzo]
    paths: [.github/workflows/check.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검 (--check)
        continue-on-error: true
        run: python collector.py --check
      - name: にじさんじ API 와 ぶいすぽ 피드 날짜 확인
        run: |
          python - <<'PY'
          import sys, json
          sys.path.insert(0, ".")
          import collector as C
          ref = C.datetime.now(C.JST)
          for u in ["https://www.nijisanji.jp/api/news?limit=5", "https://www.nijisanji.jp/api/news"]:
              try:
                  raw = C.fetch(u); print(u, "->", len(raw), "bytes"); print("  ", raw[:700].decode("utf-8", "replace"))
              except Exception as e: print(u, "-> 실패", e)
          ents = C.parse_feed(C.fetch("https://vspo.jp/news/feed"))
          fresh = [e for e in ents if e[3] and e[3] >= ref - C.timedelta(days=C.FRESH_DAYS)]
          print("vspo:", len(ents), "건 중 최근", C.FRESH_DAYS, "일", len(fresh), "건; 날짜 없는 글", sum(1 for e in ents if not e[3]))
          for t, d, l, w in ents[:5]: print("  ", w, C.clean(t)[:60])
          for name, u in [("PANORA", "https://panora.tokyo/feed"), ("hololive", "https://hololivepro.com/news/feed/"), ("KAI-YOU", "https://kai-you.net/contents/feed.rss")]:
              ents = C.parse_feed(C.fetch(u)); print(name, "첫 글 게시일:", ents[0][3] if ents else None)
          PY
