name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 홀로라이브 피드 점검 3 (임시)
        if: always()
        run: |
          python - <<'PY'
          import re, sys, html
          sys.path.insert(0, ".")
          import collector as C
          clean = lambda x: re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", x))).strip()
          for u in ["https://hololivepro.com/news/", "https://hololive.hololivepro.com/news/"]:
              t = C.fetch(u).decode("utf-8", "replace")
              print("\n==", u, len(t))
              links = [(m.start(), m.group(1), clean(m.group(2))) for m in re.finditer(r'<a [^>]*href="([^"]*news/[^"]*)"[^>]*>(.*?)</a>', t, re.S)]
              print("   news 링크", len(links))
              for pos, h, x in links[:10]: print("     ", h[:90], "|", x[:90])
              if links:
                  pos = links[2][0] if len(links) > 2 else links[0][0]
                  print("   HTML 근처:", re.sub(r"\s+", " ", t[max(0, pos-700):pos+900]))
              print("   json 언급", [m[:100] for m in re.findall(r'["\'](https?://[^"\']*\.json[^"\']*|/[^"\']*\.json[^"\']*)["\']', t)][:8])
              print("   time 태그", re.findall(r"<time[^>]*>.*?</time>", t, re.S)[:3], re.findall(r"\d{4}[./]\d{2}[./]\d{2}", t)[:5])
          PY
