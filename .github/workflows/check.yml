name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 연재 만화 시험 (임시)
        if: always()
        run: |
          pip install -q pillow
          python - <<'PY'
          import json, re, sys, time
          sys.path.insert(0, ".")
          import collector as C
          from datetime import datetime, timezone
          t0 = time.time()
          C.export_comics(datetime.now(timezone.utc))
          d = json.load(open("data/comics.json", encoding="utf-8"))
          print("bad", d.get("bad"), "시간", int(time.time() - t0), "초")
          for s in d["series"]:
              e = s["episodes"]
              print(f"{s['title'][:30]:32} {len(e):4}화 cover={s.get('coverNo')}")
              if "호리데이" in s["title"] or "히토너" in s["title"]:
                  print("   처음", e[:2]); print("   끝", e[-6:], "seenTo", s.get("seenTo"), "갱신", s.get("updatedAt"))
                  print("   58~64·115~119", [(x["no"], x["title"][-8:]) for x in e if (C.ep_num(x["title"]) or 0) in list(range(58, 65)) + list(range(115, 120))])
          C.export_comics(datetime.now(timezone.utc)); t1 = time.time()
          d = json.load(open("data/comics.json", encoding="utf-8"))
          h = [s for s in d["series"] if "호리데이" in s["title"]]
          print("두 번째 실행", int(time.time() - t1), "초", len(h[0]["episodes"]) if h else None, "화")
          PY
