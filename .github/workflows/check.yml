name: 소스 점검

on:
  workflow_dispatch: {}
  push:
    branches: [claude/japan-events-board-setup-co2nzo]
    paths: [.github/workflows/check.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검 (--check)
        continue-on-error: true
        run: python collector.py --check
      - name: コラボカフェ REST 글 타입 탐색
        run: |
          python - <<'PY'
          import urllib.request, json
          UA = "matome-board-collector/0.1 (personal use)"
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return r.status, r.read()
              except Exception as e: return f"ERR {e}", b""
          st, b = get("https://collabo-cafe.com/wp-json/wp/v2/types")
          print("types ->", st)
          if st == 200:
              for k, v in json.loads(b).items(): print("  ", k, "rest_base=", v.get("rest_base"), "name=", v.get("name"))
          for u in ["https://collabo-cafe.com/wp-json/wp/v2/posts?per_page=5&orderby=date&order=desc&sticky=false&_fields=title,link,date",
                    "https://collabo-cafe.com/wp-json/wp/v2/events?per_page=5&orderby=date&order=desc&_fields=title,link,date",
                    "https://collabo-cafe.com/wp-json/wp/v2/event?per_page=5&orderby=date&order=desc&_fields=title,link,date"]:
              st, b = get(u)
              print(u, "->", st, len(b))
              if st == 200:
                  try:
                      for p in json.loads(b)[:5]: print("   ", p.get("date"), p.get("title", {}).get("rendered"), p.get("link"))
                  except Exception as e: print("   ", b[:200])
          PY
