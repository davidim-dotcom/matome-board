name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 닌자슬레이어 점검 3 (임시)
        if: always()
        run: |
          python - <<'PY'
          import re, sys, html, time, json
          sys.path.insert(0, ".")
          import collector as C
          clean = lambda x: re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", x))).strip()
          for ua in [{"User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1", "Accept": "text/html", "Accept-Language": "ko-KR,ko;q=0.9"}, {"User-Agent": "curl/8.5.0"}]:
              try:
                  t = C.fetch("https://arca.live/b/manhwa/37486873", ua).decode("utf-8", "replace"); print("ARCA OK", len(t), re.search(r"<title>(.*?)</title>", t, re.S).group(1)[:80]); break
              except Exception as e: print("ARCA", ua["User-Agent"][:20], e)
          t = C.dc_fetch("https://m.dcinside.com/mini/yukiyogo/95")
          i = t.find('class="thum-txtin"'); j = t.find('class="gall-detail-lst', i); body = t[i:j]
          k = body.find("제1부"); print("RAW HTML 1", body[k-600:k+2500])
          k = body.find("섀도 콘"); print("RAW HTML 2", body[k-800:k+900])
          # 초안 파서: 본문을 순서대로 훑어 부/권/작품/회차 링크를 뽑는다
          toks = re.findall(r'<a [^>]*href="([^"]+)"[^>]*>(.*?)</a>|([^<]+)', body, re.S)
          out, part, vol, arc = [], "", "", ""
          for href, atext, text in toks:
              if href:
                  lab = clean(atext)
                  m = re.search(r"(?:m\.dcinside\.com/(?:mini|board)/(\w+)/(\d+)|gall\.dcinside\.com/(?:mini/)?board/view/?\?id=(\w+)(?:&amp;|&)no=(\d+))", html.unescape(href))
                  if lab: out.append((part, vol, arc, lab, (m.group(1) or m.group(3), int(m.group(2) or m.group(4))) if m else html.unescape(href)[:60]))
              else:
                  x = clean(text)
                  if not x: continue
                  for mm in re.finditer(r"◆([^◆]+)◆|제(\d+)권|「\s*([^」]+?)\s*」", x):
                      if mm.group(1): part, vol, arc = mm.group(1).strip(), "", ""
                      elif mm.group(2): vol = mm.group(2)
                      else: arc = mm.group(3).strip()
          print("PARSED", len(out))
          for o in out: print("   ", o)
          for no in (101, 264):
              tt = C.dc_fetch(f"https://m.dcinside.com/mini/yukiyogo/{no}"); time.sleep(1)
              i = tt.find('class="thum-txtin"'); j = tt.find('class="gall-detail-lst', i)
              print(f"\n[{no}]", clean(tt[i:j])[:1500])
          PY
