name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 방영 목록 점검 (임시)
        if: always()
        run: |
          python collector.py --anime
          python - <<'PY'
          import json; d=json.load(open("data/anime.json",encoding="utf-8")); L=d["list"]
          print(d["season"], d["src"], len(L), "편; 시각 있음", sum(1 for a in L if a["tm"]), "; 요일별", {k: sum(1 for a in L if a["d"]==k) for k in range(9)})
          for a in sorted(L, key=lambda a: a["r"] or 999)[:12]: print("  ", a["r"], a["d"], a["tm"], a["t"][:30], "|", a["st"][:14], "|", a["s"], "| pv" if a["pv"] else "", "| site" if a["site"] else "")
          th=json.load(open("data/thumbs.json",encoding="utf-8")); print("thumbs", len(th))
          PY
