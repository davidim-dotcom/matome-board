name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py --check
      - name: 나니와 점검 (임시)
        if: always()
        run: |
          python - <<'PY'
          import re, sys
          sys.path.insert(0, ".")
          import collector as C
          for no in [6737503, 6742738, 6723707, 6748146]:
              t = C.dc_fetch(f"https://m.dcinside.com/board/comic_new6/{no}")
              h = re.search(r'"headline":"([^"]*)"', t)
              name, box, when, cover = C.parse_post(t)
              print(no, "제목", h.group(1) if h else None, "길이", len(t), "상자", name, len(box))
              print("   ", [(b[1], b[2][-8:]) for b in box if (C.ep_num(b[2]) or 0) >= 30])
          rows = C.dc_search("나니와 금융도", 6, [6])
          print("검색", [(r["no"], r["title"]) for r in rows])
          PY
