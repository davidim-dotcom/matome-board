name: 소스 점검

# 수집 소스를 하나씩 가져와 보고 OK/FAIL 만 출력한다. data/ 는 바꾸지 않는다.
# collector.py 의 SOURCES 를 고친 뒤 Actions 화면에서 'Run workflow' 로 확인할 때 쓴다.

on:
  workflow_dispatch:
    inputs:
      dump:
        description: "페이지 원본을 로그로 볼 출처 이름(예: ホロライブ公式). 비우면 점검만"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소스 점검
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
          DUMP: ${{ inputs.dump }}   # 입력은 run 줄에 직접 넣지 않고 환경변수로만 넘긴다(명령 주입 방지)
        run: python collector.py --check
