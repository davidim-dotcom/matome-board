name: 임시 탐색

on:
  workflow_dispatch: {}
  push:
    branches: [claude/japan-events-board-setup-co2nzo]
    paths: [.github/workflows/probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SPICE 피드와 기사 속 티켓 링크
        run: |
          python - <<'PY'
          import sys, json, re
          sys.path.insert(0, ".")
          import collector as C
          print("==== SPICE (spice.eplus.jp)")
          for site in ["https://spice.eplus.jp/", "https://spice.eplus.jp/genres/anime_game", "https://spice.eplus.jp/articles/genre/anime_game"]:
              try:
                  u = C.discover(site); ents = C.parse_feed(C.fetch(u)); print(f"discover {site} -> {u} ({len(ents)}건)")
                  for t, d, l, w, img in ents[:5]: print("   -", w, C.clean(t)[:60], "|", l, "| img" if img else "")
              except Exception as e:
                  print(f"discover {site} -> 실패 {e}")
                  try:
                      page = C.fetch(site).decode("utf-8", "replace")
                      print("   len", len(page), "feed hrefs:", sorted(set(re.findall(r'href=["\']([^"\']*(?:rss|feed|atom)[^"\']*)', page, re.I)))[:6])
                  except Exception as e2: print("   fetch 실패", e2)
          for u in ["https://spice.eplus.jp/feed", "https://spice.eplus.jp/rss", "https://spice.eplus.jp/articles/feed", "https://spice.eplus.jp/feed/anime_game", "https://spice.eplus.jp/genres/anime_game/feed"]:
              try: ents = C.parse_feed(C.fetch(u)); print("OK", u, len(ents), "건", [C.clean(e[0])[:40] for e in ents[:3]])
              except Exception as e: print("BAD", u, e)
          print("\n==== 기존 소식 기사에서 티켓 링크 추출 시험")
          items = json.load(open("data/items.json", encoding="utf-8"))
          picked = [i for i in items if i.get("category") in ("live", "collab", "popup", "event", "official", "exhibit") and not i.get("ticketUrl") and i.get("platform") not in ("holodex", "youtube") and "eplus.jp" not in i["url"]][:24]
          found = 0
          for i in picked:
              img, tk = C.page_info(i["url"])
              found += bool(tk)
              print(f"  [{i['category']}] {i['source']} | {i['title'][:40]} -> {tk or '-'}")
          print(f"→ {len(picked)}건 중 티켓 링크 {found}건")
          PY
