name: 임시 탐색

on:
  workflow_dispatch: {}
  push:
    branches: [claude/japan-events-board-setup-co2nzo]
    paths: [.github/workflows/probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: e+ 목록 페이지 구조
        run: |
          python - <<'PY'
          import re, json, gzip, urllib.request, urllib.error, html
          UAS = {"script": "matome-board-collector/0.1 (personal use)",
                 "browser": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"}
          def get(url, ua):
              req = urllib.request.Request(url, headers={"User-Agent": UAS[ua], "Accept": "text/html,*/*", "Accept-Language": "ja", "Accept-Encoding": "gzip"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      b = r.read()
                      if r.headers.get("content-encoding") == "gzip": b = gzip.decompress(b)
                      return r.status, r.geturl(), b.decode("utf-8", "replace")
              except urllib.error.HTTPError as e: return e.code, url, (e.read() or b"")[:300].decode("utf-8", "replace")
              except Exception as e: return f"ERR {e}", url, ""
          URLS = ["https://eplus.jp/sf/event/anime/tokyo", "https://eplus.jp/sf/anime/kanto", "https://eplus.jp/sf/event/anime", "https://eplus.jp/sf/anime",
                  "https://eplus.jp/sf/event/anime/tokyo/p27", "https://eplus.jp/sf/search?genre=anime", "https://eplus.jp/sf/word/0000000000"]
          for u in URLS:
              for ua in ("script", "browser"):
                  st, final, page = get(u, ua)
                  print(f"\n[{u}] UA={ua} -> {st} final={final} len={len(page)}")
                  if not isinstance(st, int) or st != 200: print("   head:", page[:200].replace("\n", " ")); continue
                  lds = re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', page, re.S)
                  print("   ld+json 블록:", len(lds), "| 'Event' 등장:", page.count('"@type":"Event"') + page.count('"@type": "Event"'),
                        "| /sf/detail/ 링크:", len(set(re.findall(r'href=["\']([^"\']*/sf/detail/[^"\']+)', page))),
                        "| __NEXT_DATA__:", "__NEXT_DATA__" in page, "| 차단 징후:", bool(re.search(r"Access Denied|Pardon Our Interruption|robot|captcha", page, re.I)))
                  for ld in lds[:2]: print("   ld:", re.sub(r"\s+", " ", ld)[:900])
                  m = re.search(r'/sf/detail/', page)
                  if m: print("   detail 주변:", re.sub(r"\s+", " ", page[max(0, m.start()-700): m.start()+400])[:1100])
                  if ua == "browser": break
          PY
