name: 임시 탐색

on:
  workflow_dispatch: {}
  push:
    branches: [claude/japan-events-board-setup-co2nzo]
    paths: [.github/workflows/probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 이벤트 캘린더 후보와 공연 기사 티켓 링크
        run: |
          python - <<'PY'
          import sys, json, re, html
          sys.path.insert(0, ".")
          import collector as C
          def show_page(u):
              try:
                  page = C.fetch(u).decode("utf-8", "replace")
              except Exception as e:
                  print(f"[{u}] 실패 {e}"); return ""
              tk = re.findall(r"https?://[^\s\"'<>()]*(?:eplus\.jp|pia\.jp|l-tike\.com)[^\s\"'<>()]*", html.unescape(page))
              print(f"[{u}] len={len(page)} 티켓 링크 {len(set(tk))}개 예:{sorted(set(tk))[:3]} ld+json={page.count('ld+json')} Event={page.count('\"@type\":\"Event\"')+page.count('\"@type\": \"Event\"')}")
              return page
          print("==== アニメハック 이벤트 캘린더")
          for u in ["https://anime.eiga.com/event/cal/202611/", "https://anime.eiga.com/event/", "https://anime.eiga.com/event/cal/"]:
              page = show_page(u)
              if page:
                  m = re.search(r"eplus\.jp", page)
                  if m: print("   eplus 주변:", re.sub(r"\s+", " ", page[max(0, m.start()-900): m.start()+300])[:1200])
                  for ld in re.findall(r'<script[^>]+ld\+json[^>]*>(.*?)</script>', page, re.S)[:1]: print("   ld:", re.sub(r"\s+", " ", ld)[:600])
          print("\n==== Eventernote")
          for u in ["https://www.eventernote.com/", "https://www.eventernote.com/events", "https://www.eventernote.com/events/rss", "https://www.eventernote.com/feed", "https://www.eventernote.com/events.rss"]:
              try:
                  raw = C.fetch(u); page = raw.decode("utf-8", "replace")
                  try: ents = C.parse_feed(raw); print(f"[{u}] feed {len(ents)}건", [C.clean(e[0])[:40] for e in ents[:3]])
                  except Exception: print(f"[{u}] html len={len(page)} feed hrefs:", sorted(set(re.findall(r'href=["\']([^"\']*(?:rss|feed|atom)[^"\']*)', page, re.I)))[:6])
              except Exception as e: print(f"[{u}] 실패 {e}")
          print("\n==== 공연·공식 소스 기사에서 티켓 링크")
          items = json.load(open("data/items.json", encoding="utf-8"))
          picked = [i for i in items if i.get("source") in ("PANORA", "ホロライブ公式", "にじさんじ公式", "KAI-YOU", "アニメ!アニメ!") and i.get("category") in ("live", "event", "official") and not i.get("ticketUrl")][:16]
          found = 0
          for i in picked:
              img, tk = C.page_info(i["url"]); found += bool(tk)
              print(f"  [{i['category']}] {i['source']} | {i['title'][:40]} -> {tk or '-'}")
          print(f"→ {len(picked)}건 중 티켓 링크 {found}건")
          PY
