name: 임시 탐색

on:
  workflow_dispatch: {}
  push:
    branches: [claude/japan-events-board-setup-co2nzo]
    paths: [.github/workflows/probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 배너 제외 확인
        run: |
          python - <<'PY'
          import sys, json
          sys.path.insert(0, ".")
          import collector as C
          items = json.load(open("data/items.json", encoding="utf-8"))
          for name in ("PANORA", "ホロライブ公式", "KAI-YOU"):
              for i in [i for i in items if i.get("source") == name][:4]:
                  print(f"  [{name}] {i['title'][:36]} ->", C.page_info(i["url"])[1] or "-")
          print("배너로 본 링크:", {h: sorted(v)[:4] for h, v in C._site_links.items()})
          PY
