name: 소식 자동 업데이트

on:
  schedule:
    # 일본 시간 06:00, 12:00, 18:00, 24:00 (UTC 기준으로 적음)
    - cron: "0 21,3,9,15 * * *"
  workflow_dispatch: {}   # Actions 화면에서 'Run workflow'로 바로 실행 가능

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이미지 처리 라이브러리 설치
        run: pip install pillow

      - name: 소식 수집
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: python collector.py

      - name: 방영 목록과 썸네일
        env:
          ANNICT_TOKEN: ${{ secrets.ANNICT_TOKEN }}
        run: python collector.py --anime

      - name: 연재 만화 색인
        run: python collector.py --comics

      - name: 바뀐 내용 저장
        run: |
          git config user.name "matome-bot"
          git config user.email "matome-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "소식 업데이트 $(TZ=Asia/Tokyo date '+%m/%d %H:%M')"
            git push
          fi
